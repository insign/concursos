# Configuração do projeto Cloudflare Pages "concursos".
#
# O build estático continua igual (`npm run build` publica `dist/`); a pasta
# `functions/` adiciona uma única rota dinâmica, `/media/*`, que entrega os
# arquivos de mídia do bucket R2 com resposta parcial (206). O Cloudflare Pages
# responde 200 para HTTP Range em assets estáticos, e o iOS Safari exige 206
# para tocar áudio e vídeo.
name = "concursos"
account_id = "792cdd8dd982975da04155cf8b4d9403"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-13"

[env.production]

# Bucket privado: a mídia só é servida pela rota `/media/*`, na mesma origem.
[[r2_buckets]]
binding = "MIDIA"
bucket_name = "concursos-midia"
