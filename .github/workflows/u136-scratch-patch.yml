name: U136 scratch patch

on:
  push:
    branches:
      - scratch/u136-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated U136 transformation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/content/biblioteca/gestao-contratos/gestao-aplicada-execucao-contratual/questoes.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1
          assert data['questionSetRevision'] == 2
          assert len(data['questions']) == 200

          remove_ids = {'q2161', 'q2172', 'q4474', 'q4479', 'q4480', 'q4481', 'q4482', 'q4483', 'q4485'}
          existing_ids = {q['id'] for q in data['questions']}
          assert remove_ids <= existing_ids

          data['questions'] = [q for q in data['questions'] if q['id'] not in remove_ids]
          data['questionSetRevision'] = 3

          new_questions = [
            {
              'id': 'q52213601',
              'revision': 1,
              'origin': 'previous_exam',
              'prompt': 'Com relação à execução do contrato, o papel do fiscalizador do contrato e o registro e notificação de irregularidades, à luz do disposto na Lei nº 14.133/2021, assinale a afirmativa correta.',
              'options': [
                {'id': 'A', 'text': 'O contratado não poderá manter preposto no local da obra ou do serviço para representá-lo na execução do contrato.'},
                {'id': 'B', 'text': 'É possível nomear o agente da contratação dentre os fiscais do contrato, independentemente dos riscos envolvidos no exercício de tais atribuições.'},
                {'id': 'C', 'text': 'O fiscal do contrato será auxiliado pelos órgãos de assessoramento jurídico e de controle interno da Administração, que deverão dirimir dúvidas e subsidiá-lo com informações relevantes para prevenir riscos na execução contratual.'},
                {'id': 'D', 'text': 'A administração tem o dever de nomear no mínimo dois fiscais para acompanhar a execução dos contratos, que constituirão a Comissão designada para tal finalidade.'},
                {'id': 'E', 'text': 'O fiscal do contrato tem o dever de anotar em registro próprio todas as ocorrências relacionadas à execução do contrato e adotar as providências pertinentes, ainda que ultrapassem a sua competência.'}
              ],
              'correctOptionId': 'C',
              'explanation': 'Gabarito C. A Lei nº 14.133/2021 prevê que o fiscal do contrato seja auxiliado pelos órgãos de assessoramento jurídico e de controle interno para dirimir dúvidas e obter subsídios de prevenção de riscos. FGV — TCE-PA — Auditor de Controle Externo, Área Administrativa/Direito, 2024, questão 50. Prova oficial: https://conhecimento.fgv.br/sites/default/files/concursos/cns105-auditor-de-controle-externo-administrativa-direitocns105-tipo-1.pdf. Gabarito definitivo: https://conhecimento.fgv.br/sites/default/files/concursos/tcepa-1108_gabaritos-para-publicacao_definitivo.pdf.'
            },
            {
              'id': 'q52213602',
              'revision': 1,
              'origin': 'previous_exam',
              'prompt': 'Assinale a opção correta no que diz respeito à execução e fiscalização dos contratos administrativos, com base na Lei n.º 14.133/2021.',
              'options': [
                {'id': 'A', 'text': 'A indicação de um gestor de contrato, em regra, prescinde da designação de fiscais específicos para o acompanhamento técnico da execução.'},
                {'id': 'B', 'text': 'O fiscal do contrato é a autoridade máxima do órgão licitante e deve decidir pessoalmente sobre todas as modificações contratuais solicitadas pela contratada.'},
                {'id': 'C', 'text': 'A execução do contrato deve ser acompanhada e fiscalizada por um ou mais fiscais, os quais podem ser auxiliados por terceiros contratados para essa finalidade.'},
                {'id': 'D', 'text': 'A contratação de terceiros para assistir o fiscal do contrato transfere a responsabilidade final da fiscalização a esses assistentes externos.'},
                {'id': 'E', 'text': 'O ente contratado é eximido da obrigação de responder por danos causados a terceiros, que são de responsabilidade do fiscal do contrato.'}
              ],
              'correctOptionId': 'C',
              'explanation': 'Gabarito C. O art. 117 da Lei nº 14.133/2021 admite um ou mais fiscais e a assistência de terceiros contratados, sem transferir a responsabilidade pelo acompanhamento. Cebraspe — IPAAM — Analista Ambiental, especialidade Administração, 2026, questão 71. Prova: https://arquivos.qconcursos.com/prova/arquivo_prova/148787/cespe-cebraspe-2026-ipaam-analista-ambiental-especialidade-administracao-prova.pdf. Gabarito definitivo oficial: https://cdn.cebraspe.org.br/concursos/ipaam_25/arquivos/C96483D05515B6EA48E1544AA605E9E96973A5F4379628E4A01CA0DDE690C897.pdf.'
            },
            {
              'id': 'q52213603',
              'revision': 1,
              'origin': 'previous_exam',
              'prompt': 'Assinale a opção correta em relação a obrigações do gestor e do fiscal de contratos celebrados com a administração pública.',
              'options': [
                {'id': 'A', 'text': 'A fiscalização exercida pela administração pública sobre o contrato desonera o ente contratado da responsabilidade integral pela execução perfeita do objeto pactuado.'},
                {'id': 'B', 'text': 'O gestor do contrato é a autoridade responsável pela conferência técnica do serviço, eximindo-se de atribuições de caráter administrativo ou relativas a controle de prazos.'},
                {'id': 'C', 'text': 'O fiscal do contrato deve resolver a situação diretamente com o representante do ente contratado, caso as decisões para a regularização da execução contratual ultrapassem sua competência.'},
                {'id': 'D', 'text': 'O representante da administração pública responsável pela fiscalização técnica deve ser obrigatoriamente um agente político de livre nomeação e exoneração.'},
                {'id': 'E', 'text': 'O fiscal do contrato deve anotar em registro próprio todas as ocorrências relacionadas à execução do contrato e determinar o que for necessário à correção dos defeitos observados.'}
              ],
              'correctOptionId': 'E',
              'explanation': 'Gabarito E. O art. 117, § 1º, da Lei nº 14.133/2021 atribui ao fiscal o registro próprio das ocorrências e a determinação do necessário à regularização das faltas ou defeitos observados. Cebraspe — IPAAM — Analista Ambiental, especialidade Administração, 2026, questão 72. Prova: https://arquivos.qconcursos.com/prova/arquivo_prova/148787/cespe-cebraspe-2026-ipaam-analista-ambiental-especialidade-administracao-prova.pdf. Gabarito definitivo oficial: https://cdn.cebraspe.org.br/concursos/ipaam_25/arquivos/C96483D05515B6EA48E1544AA605E9E96973A5F4379628E4A01CA0DDE690C897.pdf.'
            },
            {
              'id': 'q52213604',
              'revision': 1,
              'origin': 'previous_exam',
              'prompt': 'Sobre a gestão e a fiscalização contratual, no regime da Lei n.º 14.133/2021 e das normas federais de contratações, assinale a alternativa correta.',
              'options': [
                {'id': 'A', 'text': 'A nomeação do fiscal do contrato pode ser feita informalmente pelo gestor da área, com posterior convalidação, desde que haja registros das visitas e medições.'},
                {'id': 'B', 'text': 'O fiscal pode ordenar, por conta própria, a execução de serviços adicionais e alterações quantitativas, desde que dentro do limite de 25%.'},
                {'id': 'C', 'text': 'As ocorrências contratuais podem ser registradas de modo sucinto e verbal, privilegiando a celeridade, e formalizadas somente se houver penalidade.'},
                {'id': 'D', 'text': 'A contratada deve manter preposto aceito pela Administração para representá-la durante a execução, podendo o fiscal exigir sua presença sempre que necessário.'},
                {'id': 'E', 'text': 'Atestos de execução podem ser emitidos pela própria contratada, mediante declaração do preposto, quando acompanhados de evidências fotográficas.'}
              ],
              'correctOptionId': 'D',
              'explanation': 'Gabarito D. A contratada deve manter preposto aceito pela Administração para representá-la na execução, e a fiscalização pode exigir sua presença conforme necessário. Ibest — CRM-DF — Assistente Administrativo, 2025, questão 48. Prova oficial: https://anexos.cdn.selecao.net.br/uploads/729/concursos/38/anexos/726789c5-b2f6-48b9-aad2-18026082f4b7.pdf. Gabarito definitivo oficial: https://anexos.cdn.selecao.net.br/uploads/729/concursos/38/anexos/0da21d64-b90b-4db2-bcd7-5c2a595c26f8.pdf.'
            }
          ]

          assert not ({q['id'] for q in new_questions} & {q['id'] for q in data['questions']})
          data['questions'].extend(new_questions)
          assert len(data['questions']) == 195
          assert sum(q.get('origin') == 'previous_exam' for q in data['questions']) == 4
          assert sum(q.get('origin') == 'authorial' for q in data['questions']) == 191
          for q in data['questions']:
              option_ids = [o['id'] for o in q['options']]
              assert len(option_ids) == len(set(option_ids))
              assert q['correctOptionId'] in option_ids
          ids = [q['id'] for q in data['questions']]
          assert len(ids) == len(set(ids))

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Keep only the target-file tree delta
        shell: bash
        run: |
          rm .github/workflows/u136-scratch-patch.yml
          git config user.name 'Hélio'
          git config user.email 'insign@gmail.com'
          git add src/content/biblioteca/gestao-contratos/gestao-aplicada-execucao-contratual/questoes.json .github/workflows/u136-scratch-patch.yml
          git diff --cached --check
          git commit -m 'feat(content): amplia questões reais da U136'
          git push origin HEAD:scratch/u136-patcher
