name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-quality:
    name: Content quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Astro checks
        id: astro-check
        continue-on-error: true
        run: npm run check > astro-check.log 2>&1

      - name: Upload Astro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-${{ github.sha }}
          path: astro-check.log
          retention-days: 1

      - name: Enforce Astro checks
        if: steps.astro-check.outcome == 'failure'
        run: exit 1

      - name: Build production site
        run: npm run build
