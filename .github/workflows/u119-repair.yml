name: Repair U119 branch

on:
  push:
    branches:
      - helio/u119-estoques-questoes-reais
    paths:
      - .github/workflows/u119-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild minimal U119 change from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/assuntos/tce-ma-2026-analista-administracao/conhecimentos-especificos/administracao-recursos-materiais-patrimoniais/previsao-controle-estoque/questoes.json')
          text = path.read_text(encoding='utf-8')

          old_revision = '"questionSetRevision": 2'
          assert text.count(old_revision) == 1, 'unexpected questionSetRevision'
          text = text.replace(old_revision, '"questionSetRevision": 3', 1)

          ending = '\n  ]\n}\n'
          assert text.endswith(ending), 'unexpected JSON ending'

          additions = r'''    {
      "id": "q52211901",
      "revision": 1,
      "origin": "previous_exam",
      "prompt": "A filosofia just in time preconiza a eliminação de excessos de estoque e a redução do desperdício.",
      "options": [
        {"id": "C", "text": "Certo"},
        {"id": "E", "text": "Errado"}
      ],
      "correctOptionId": "C",
      "explanation": "Certo. O just in time busca sincronizar o fluxo com a necessidade, reduzindo estoques excedentes e desperdícios. Fonte oficial: CEBRASPE; PCDF; Cargo 17 — Analista de Apoio às Atividades Policiais Civis, especialidade Agente Administrativo; aplicação em 19/01/2025; item 105; gabarito oficial definitivo C."
    },
    {
      "id": "q52211902",
      "revision": 1,
      "origin": "previous_exam",
      "prompt": "A definição de uma política de estoque inclui a análise dos itens a serem estocados e a quantidade máxima prevista para cada item.",
      "options": [
        {"id": "C", "text": "Certo"},
        {"id": "E", "text": "Errado"}
      ],
      "correctOptionId": "C",
      "explanation": "Certo. A política de estoque define parâmetros de manutenção e reposição, incluindo os itens mantidos e limites planejados de quantidade. Fonte oficial: CEBRASPE; Embrapa; Técnico — Área Suprimento, Manutenção e Serviços, Subárea Suporte à Gestão; aplicação em 23/03/2025; item 46; gabarito oficial definitivo C."
    }'''

          text = text[:-len(ending)] + ',\n' + additions + ending
          path.write_text(text, encoding='utf-8')
          PY
          python -m json.tool src/content/assuntos/tce-ma-2026-analista-administracao/conhecimentos-especificos/administracao-recursos-materiais-patrimoniais/previsao-controle-estoque/questoes.json >/dev/null
          git add src/content/assuntos/tce-ma-2026-analista-administracao/conhecimentos-especificos/administracao-recursos-materiais-patrimoniais/previsao-controle-estoque/questoes.json
          git commit -m "feat(content): add real inventory questions for U119"
          git push --force origin HEAD:${GITHUB_REF_NAME}
